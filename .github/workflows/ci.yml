name: CI & Deploy

# Manual trigger only — click "Run workflow" in the Actions tab.
# CI (verify) runs first; deploy runs only if verify passes.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (@rp/engine -> dist)
        run: pnpm --filter @rp/engine build

      - name: Typecheck
        run: |
          pnpm --filter @rp/engine typecheck
          pnpm --filter @rp/web typecheck

      - name: Engine tests
        run: pnpm --filter @rp/engine test

      - name: Web tests
        run: pnpm --filter @rp/web test

      - name: Next production build
        run: pnpm --filter @rp/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        run: |
          npm install -g vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
